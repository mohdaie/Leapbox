plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leapbox.prototype'
    compileSdk 35

    defaultConfig {
        applicationId 'com.leapbox.prototype'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0-usb-bridge'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
