plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leapbox.prototype'
    compileSdk 35

    defaultConfig {
        applicationId 'com.leapbox.prototype'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '0.3.1-live-video'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
